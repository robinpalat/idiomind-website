<!doctype html>
<html>
<head>
   <meta charset="UTF-8">
   <link rel="shortcut icon" href="/favicon.ico">
   <title>Topics</title>
   <link rel="stylesheet" href="/css/mobilebox.css">
</head>

<body>
<div id="container">

    <table class="sortable">
        <thead>
        <tr>
        </tr>
        </thead>
        <tbody id="favsBody">
        </tbody>
    </table>
</div>
<script>
(function() {
    var lang = "russian";
    var cookie_name = lang.charAt(0) + 'PINS';
    var faves = "";
    var decodedCookie = decodeURIComponent(document.cookie);
    var ca = decodedCookie.split(';');
    for (var i = 0; i < ca.length; i++) {
        var c = ca[i];
        while (c.charAt(0) == ' ') c = c.substring(1);
        if (c.indexOf(cookie_name + '=') == 0) {
            faves = c.substring(cookie_name.length + 1);
            break;
        }
    }
    if (!faves) return;
    var parts = faves.split('|');
    var tbody = document.getElementById('favsBody');
    for (var i = 0; i < parts.length; i++) {
        var fav = parts[i];
        if (fav && fav !== '|') {
            var tr = document.createElement('tr');
            tr.id = 'box';
            tr.innerHTML = '<td style="width:5%"><a href="/russian/mobileview.html?l=russian&c=fav&set=' + encodeURIComponent(fav) + '"><img class="expand" src="/images/idmnd.png"></a></td>' +
                '<td style="width:90%"><a href="/russian/mobileview.html?l=russian&c=fav&set=' + encodeURIComponent(fav) + '">' + fav + '</a></td>';
            tbody.appendChild(tr);
        }
    }
})();
</script>
</body>
</html>
